<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#102c4e"/>
      <stop offset="100%" style="stop-color:#1d5d91"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6ad3c"/>
      <stop offset="100%" style="stop-color:#f0c14b"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <!-- Chart bars -->
  <rect x="28" y="58" width="12" height="28" rx="2" fill="#fff" opacity="0.9"/>
  <rect x="44" y="42" width="12" height="44" rx="2" fill="url(#gold)"/>
  <rect x="60" y="48" width="12" height="38" rx="2" fill="#fff" opacity="0.9"/>
  <rect x="76" y="32" width="12" height="54" rx="2" fill="url(#gold)"/>
  <!-- Trend line -->
  <polyline points="34,70 50,48 66,54 82,36" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dot on top -->
  <circle cx="82" cy="36" r="4" fill="#e6ad3c"/>
</svg>
