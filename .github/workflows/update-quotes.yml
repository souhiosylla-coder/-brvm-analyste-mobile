name: Mise à jour des cotations BRVM

on:
  schedule:
    - cron: "5 8-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Backup quotes + fundamentals
        run: |
          [ -f quotes.json ] && cp quotes.json quotes.json.bak || true
          [ -f fundamentals.json ] && cp fundamentals.json fundamentals.json.bak || true

      - name: Sync BloomAfrik (48 titres)
        run: python scripts/sync_bloomafrik.py

      - name: Fallback scraper BRVM si BloomAfrik échoue
        if: failure()
        run: python scripts/update_quotes.py

      - name: Valider les fichiers
        run: |
          python3 << 'PY'
          import json, sys
          from pathlib import Path
          q = json.loads(Path("quotes.json").read_text(encoding="utf-8"))
          assert len(q.get("quotes") or []) >= 10
          f = json.loads(Path("fundamentals.json").read_text(encoding="utf-8"))
          assert isinstance(f.get("fundamentals"), dict) and len(f["fundamentals"]) >= 10
          print("OK", len(q["quotes"]), "quotes,", len(f["fundamentals"]), "fundamentals")
          PY

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json fundamentals.json
          git diff --cached --quiet || git commit -m "Mise à jour BloomAfrik (cotations + fondamentaux)"
          git push
