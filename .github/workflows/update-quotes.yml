name: Mise à jour des cotations BRVM

on:
  schedule:
    # Toutes les heures en séance (lun-ven, 8h-16h UTC = heures BRVM)
    - cron: "5 8-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Mettre à jour les cotations
        run: python scripts/update_quotes.py

      - name: Enregistrer les nouvelles cotations
        run: |
          if [ -f quotes.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add quotes.json
            git diff --cached --quiet || git commit -m "Mise à jour des cotations BRVM"
            git push
          fi
