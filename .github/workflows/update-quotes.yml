name: Mise à jour des cotations BRVM

on:
  schedule:
    - cron: "5 8-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Tests formules financières
        run: |
          python scripts/test_formulas.py
          echo "Tests formules OK"

      - name: Backup quotes + fundamentals
        run: |
          [ -f quotes.json ] && cp quotes.json quotes.json.bak || true
          [ -f fundamentals.json ] && cp fundamentals.json fundamentals.json.bak || true

      - name: Sync BloomAfrik (48 titres)
        id: sync
        run: |
          set -e
          python scripts/sync_bloomafrik.py
          echo "Sync BloomAfrik terminé"

      - name: Fallback scraper BRVM si BloomAfrik échoue
        if: failure() && steps.sync.outcome == 'failure'
        run: |
          echo "BloomAfrik a échoué — fallback scraper BRVM"
          python scripts/update_quotes.py

      - name: Historique clôtures (graphiques techniques)
        run: python scripts/update_history.py || true

      - name: Valider les fichiers produits
        run: |
          python3 << 'PY'
          import json, sys
          from pathlib import Path

          def fail(msg):
              print("ERREUR VALIDATION:", msg)
              sys.exit(1)

          qpath = Path("quotes.json")
          fpath = Path("fundamentals.json")
          if not qpath.exists():
              fail("quotes.json absent")
          if not fpath.exists():
              fail("fundamentals.json absent")

          try:
              q = json.loads(qpath.read_text(encoding="utf-8"))
          except json.JSONDecodeError as e:
              fail(f"quotes.json JSON invalide: {e}")

          try:
              f = json.loads(fpath.read_text(encoding="utf-8"))
          except json.JSONDecodeError as e:
              fail(f"fundamentals.json JSON invalide: {e}")

          quotes = q.get("quotes") or []
          if not isinstance(quotes, list) or len(quotes) < 10:
              fail(f"trop peu de cotations: {len(quotes)}")

          for item in quotes:
              sym = item.get("symbol")
              px = item.get("price")
              if not sym or not isinstance(px, (int, float)) or px <= 0:
                  fail(f"cotation invalide: {item}")

          funds = f.get("fundamentals")
          if not isinstance(funds, dict) or len(funds) < 10:
              fail(f"fondamentaux insuffisants: {type(funds)} n={len(funds) if isinstance(funds, dict) else 0}")

          bak = Path("quotes.json.bak")
          if bak.exists():
              try:
                  old = json.loads(bak.read_text(encoding="utf-8"))
                  old_n = len(old.get("quotes") or [])
                  if old_n >= 20 and len(quotes) < int(old_n * 0.7):
                      fail(f"régression cotations: {old_n} -> {len(quotes)}")
              except Exception:
                  pass

          seance = q.get("retrieved_on")
          print(f"Validation OK: {len(quotes)} cotations, {len(funds)} fondamentaux, séance={seance}, source={q.get('source')}")
          PY

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json fundamentals.json history.json
          git diff --cached --quiet || git commit -m "Mise à jour BloomAfrik (cotations + fondamentaux + historique)"
          git push
